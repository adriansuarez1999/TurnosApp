{% load static %}

<header>

  <nav
    class="navbar navbar-expand-lg bg-body border-bottom shadow-sm"
  >

    <div class="container">


      <!-- ═══════════════════════════════════════════════════════
           LOGO
      ═════════════════════════════════════════════════════════ -->

      <a
        class="navbar-brand d-flex align-items-center gap-2"
        href="{% url 'index' %}"
        aria-label="BarberApp — Inicio"
      >

        <span class="navbar-brand__icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >

            <circle
              cx="6"
              cy="6"
              r="3"
            ></circle>


            <circle
              cx="6"
              cy="18"
              r="3"
            ></circle>


            <line
              x1="20"
              y1="4"
              x2="8.12"
              y2="15.88"
            ></line>


            <line
              x1="14.47"
              y1="14.48"
              x2="20"
              y2="20"
            ></line>


            <line
              x1="8.12"
              y1="8.12"
              x2="12"
              y2="12"
            ></line>

          </svg>

        </span>


        <span class="navbar-brand__text">

          Barber<span>App</span>

        </span>

      </a>



      <!-- ═══════════════════════════════════════════════════════
           BOTÓN MOBILE
      ═════════════════════════════════════════════════════════ -->

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarPrincipal"
        aria-controls="navbarPrincipal"
        aria-expanded="false"
        aria-label="Abrir navegación"
      >

        <span
          class="navbar-toggler-icon"
        ></span>

      </button>



      <!-- ═══════════════════════════════════════════════════════
           CONTENIDO NAVBAR
      ═════════════════════════════════════════════════════════ -->

      <div
        class="collapse navbar-collapse"
        id="navbarPrincipal"
      >


        <!-- LINKS -->
        <ul
          class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4"
        >

          <li class="nav-item">

            <a
              class="nav-link"
              href="{% url 'index' %}#listado-barberias"
            >
              Reservar turno
            </a>

          </li>


          <li class="nav-item">

            <a
              class="nav-link"
              href="{% url 'index' %}#listado-barberias"
              id="nav-barberias"
            >
              Barberías
            </a>

          </li>


          <li class="nav-item">

            <a
              class="nav-link"
              href="/paginas/misturnos.html"
            >
              Mis turnos
            </a>

          </li>


          <li class="nav-item">

            <a
              class="nav-link"
              href="#"
            >
              Promociones
            </a>

          </li>

        </ul>



        <!-- ═════════════════════════════════════════════════════
             SIN SESIÓN
        ══════════════════════════════════════════════════════ -->

        <div
          class="nav__auth align-items-center gap-2"
          role="group"
          aria-label="Acciones de cuenta"
        >

          <button
            class="btn btn-outline-primary"
            id="btn-crear-cuenta"
            type="button"
          >
            Crear cuenta
          </button>


          <button
            class="btn btn-primary"
            id="btn-acceder"
            type="button"
          >
            Acceder
          </button>

        </div>



        <!-- ═════════════════════════════════════════════════════
             CON SESIÓN
        ══════════════════════════════════════════════════════ -->

        <div
          class="nav__logueado align-items-center gap-2"
          id="nav-logueado"
        >

          <span
            class="text-body-secondary me-1"
          >

            Hola,

            <strong
              class="text-body"
              id="nav-nombre-usuario"
            ></strong>

          </span>


          <a
            href="{% url 'mi_barberia' %}"
            class="btn btn-outline-primary"
            id="nav-panel-link"
            style="display: none;"
          >
            Mi panel
          </a>


          <button
            class="btn btn-outline-secondary"
            id="btn-salir"
            type="button"
          >
            Salir
          </button>

        </div>

      </div>

    </div>

  </nav>

</header>


<!--
  Este script se carga junto con el navbar.

  Como este partial aparece en todas las páginas,
  nav.js también estará disponible en todas.
-->

<script src="{% static 'js/nav.js' %}"></script>
