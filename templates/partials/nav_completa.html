<header class="site-header" role="banner">
  <nav class="nav container" aria-label="Navegación principal">
    <button
      class="nav__hamburger"
      aria-label="Abrir menú"
      aria-expanded="false"
    >
      <span></span><span></span><span></span>
    </button>

    <a
      href="{% url 'index' %}"
      class="nav__logo"
      aria-label="BarberApp — Inicio"
    >
      <div class="nav__logo-mark" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="#111"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 3v12" />
          <path d="M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
          <path d="M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
          <path d="M15 6l-9 9" />
          <path d="M18 15l-3-3" />
        </svg>
      </div>
      <span class="nav__logo-text">Barber<span>App</span></span>
    </a>

    <ul class="nav__links" role="list">
      <li><a href="#">Reservar turno</a></li>
      <li><a href="#" id="nav-barberias">Barberías</a></li>
      <li><a href="#">Mis turnos</a></li>
      <li><a href="#">Promociones</a></li>
    </ul>

    <div class="nav__spacer" aria-hidden="true"></div>

    <div class="nav__user">
      <div class="nav__avatar" aria-label="Perfil de usuario" role="img">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </div>
      <span class="nav__user-label">Usuario</span>
    </div>

    <div class="nav__auth" role="group" aria-label="Acciones de cuenta">
      <button class="btn-outline" id="btn-crear-cuenta">Crear cuenta</button>
      <button class="btn-accent" id="btn-acceder">Acceder</button>
    </div>

    <div class="nav__logueado" id="nav-logueado">
      <p class="nav__bienvenida">Hola, <span id="nav-nombre-usuario"></span></p>
      <a href="{% url 'mi_barberia' %}" class="nav__panel-link" id="nav-panel-link" style="display:none;">Mi panel</a>
      <button class="btn-salir" id="btn-salir">Salir</button>
    </div>
  </nav>
</header>
