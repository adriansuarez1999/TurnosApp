{% load static %}

<header>

  <nav
    class="navbar navbar-expand-lg bg-body border-bottom shadow-sm"
    aria-label="Navegación principal"
  >

    <div class="container">

      <a
        class="navbar-brand d-flex align-items-center gap-2"
        href="{% url 'index' %}"
        aria-label="BarberApp — Inicio"
      >

        <span class="navbar-brand__icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="6" cy="6" r="3"></circle>
            <circle cx="6" cy="18" r="3"></circle>
            <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
            <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
            <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
          </svg>

        </span>

        <span class="navbar-brand__text">
          Barber<span>App</span>
        </span>

      </a>


      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarPrincipal"
        aria-controls="navbarPrincipal"
        aria-expanded="false"
        aria-label="Abrir navegación"
      >
        <span class="navbar-toggler-icon"></span>
      </button>


      <div
        class="collapse navbar-collapse"
        id="navbarPrincipal"
      >

        <ul
          class="navbar-nav me-auto mb-3 mb-lg-0 ms-lg-4"
        >

          <li class="nav-item">

            <a
              class="nav-link"
              href="{% url 'index' %}#listado-barberias"
            >
              Reservar turno
            </a>

          </li>


          <li class="nav-item">

            <a
              class="nav-link"
              href="{% url 'index' %}#listado-barberias"
              id="nav-barberias"
            >
              Barberías
            </a>

          </li>


          <li class="nav-item">

            <a
              class="nav-link"
              href="/paginas/misturnos.html"
            >
              Mis turnos
            </a>

          </li>


          <li class="nav-item">

            <span
              class="nav-link disabled"
              aria-disabled="true"
              title="Próximamente"
            >
              Promociones
            </span>

          </li>

        </ul>


        <div
          class="nav__auth align-items-center gap-2"
          role="group"
          aria-label="Acciones de cuenta"
        >

          <button
            class="btn btn-outline-primary"
            id="btn-crear-cuenta"
            type="button"
          >
            Crear cuenta
          </button>


          <button
            class="btn btn-primary"
            id="btn-acceder"
            type="button"
          >
            Acceder
          </button>

        </div>


        <div
          class="nav__logueado align-items-center gap-2"
          id="nav-logueado"
        >

          <span
            class="text-body-secondary me-lg-1"
          >
            Hola,

            <strong
              class="text-body"
              id="nav-nombre-usuario"
            ></strong>
          </span>


          <!-- NOTIFICACIONES -->

          <div
            class="dropdown d-none"
            id="contenedor-notificaciones"
          >

            <button
              class="btn btn-outline-secondary position-relative"
              type="button"
              id="btn-notificaciones"
              data-bs-toggle="dropdown"
              data-bs-auto-close="outside"
              aria-expanded="false"
              aria-label="Notificaciones"
            >

              <i class="bi bi-bell"></i>

              <span
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none"
                id="badge-notificaciones"
              >
                0
              </span>

            </button>


            <div
              class="dropdown-menu dropdown-menu-end p-0 shadow"
              style="width: min(380px, 92vw);"
            >

              <div
                class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom"
              >

                <strong>
                  Notificaciones
                </strong>

                <button
                  type="button"
                  class="btn btn-link btn-sm text-decoration-none p-0 d-none"
                  id="btn-marcar-todas-leidas"
                >
                  Marcar todas como leídas
                </button>

              </div>


              <div
                id="lista-notificaciones"
                style="max-height: 420px; overflow-y: auto;"
              >

                <div
                  class="text-center text-body-secondary py-4"
                >
                  Cargando...
                </div>

              </div>

            </div>

          </div>


          <a
            href="{% url 'mi_barberia' %}"
            class="btn btn-outline-primary"
            id="nav-panel-link"
            style="display: none;"
          >
            <i class="bi bi-grid me-1"></i>
            Mi panel
          </a>


          <button
            class="btn btn-outline-secondary"
            id="btn-salir"
            type="button"
          >
            <i class="bi bi-box-arrow-right me-1"></i>
            Salir
          </button>

        </div>

      </div>

    </div>

  </nav>

</header>


<script
  src="{% static 'js/nav.js' %}"
></script>

<script
  src="{% static 'js/notificaciones.js' %}"
></script>
