<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservar turno — BarberApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <header class="site-header" role="banner">
    <nav class="nav container" aria-label="Navegación principal">
      <a href="../index.html" class="nav__logo" aria-label="BarberApp — Inicio">
        <div class="nav__logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3v12"/>
            <path d="M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
            <path d="M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
            <path d="M15 6l-9 9"/>
            <path d="M18 15l-3-3"/>
          </svg>
        </div>
        <span class="nav__logo-text">Barber<span>App</span></span>
      </a>
      <div class="nav__spacer" aria-hidden="true"></div>
    </nav>
  </header>

  <main id="main-content">
    <div id="reserva-contenido">
      <section class="reserva">
        <div class="container">

          <a href="#" onclick="history.back(); return false;" class="volver" style="color: rgba(17,17,17,0.5);">← Volver</a>

          <header class="listing__header" style="margin-top:1rem;">
            <h2>Reservar turno en <span id="reserva-nombre-barberia">...</span></h2>
          </header>

          <!-- Indicador de pasos -->
          <div class="reserva__pasos">
            <div class="reserva__paso-indicador" data-paso="1"><span class="num">1</span> Servicio</div>
            <div class="reserva__paso-indicador" data-paso="2"><span class="num">2</span> Barbero</div>
            <div class="reserva__paso-indicador" data-paso="3"><span class="num">3</span> Fecha y hora</div>
            <div class="reserva__paso-indicador" data-paso="4"><span class="num">4</span> Confirmar</div>
          </div>

          <!-- PASO 1: SERVICIO -->
          <div class="reserva__panel" id="panel-paso-1">
            <h3 class="reserva__titulo">Elegí un servicio</h3>
            <div class="opciones-lista" id="lista-opciones-servicio"></div>
            <div class="reserva__nav-botones">
              <div></div>
              <button class="btn-primario" id="btn-paso1-siguiente" disabled>Siguiente</button>
            </div>
          </div>

          <!-- PASO 2: BARBERO -->
          <div class="reserva__panel" id="panel-paso-2">
            <h3 class="reserva__titulo">Elegí un barbero</h3>
            <div class="opciones-lista" id="lista-opciones-barbero"></div>
            <div class="reserva__nav-botones">
              <button class="btn-primario" id="btn-paso2-atras" style="background:transparent; color:var(--color-text-dark); border:1.5px solid rgba(17,17,17,0.2);">Atrás</button>
              <button class="btn-primario" id="btn-paso2-siguiente" disabled>Siguiente</button>
            </div>
          </div>

          <!-- PASO 3: FECHA Y HORARIO -->
          <div class="reserva__panel" id="panel-paso-3">
            <h3 class="reserva__titulo">Elegí fecha y horario</h3>

            <div class="form-grupo reserva__campo-fecha" style="color:var(--color-text-dark);">
              <label for="input-fecha" style="color: rgba(17,17,17,0.6);">Fecha</label>
              <input type="date" id="input-fecha" style="background:#fff; color:var(--color-text-dark); border:1.5px solid rgba(17,17,17,0.15);">
            </div>

            <div class="horarios-grid" id="horarios-grid">
              <p class="listing__estado">Elegí una fecha para ver los horarios disponibles.</p>
            </div>

            <div class="reserva__nav-botones">
              <button class="btn-primario" id="btn-paso3-atras" style="background:transparent; color:var(--color-text-dark); border:1.5px solid rgba(17,17,17,0.2);">Atrás</button>
              <button class="btn-primario" id="btn-paso3-siguiente" disabled>Siguiente</button>
            </div>
          </div>

          <!-- PASO 4: RESUMEN Y CONFIRMACIÓN -->
          <div class="reserva__panel" id="panel-paso-4">
            <h3 class="reserva__titulo">Confirmá tu turno</h3>

            <div class="reserva__resumen">
              <h3>Resumen</h3>
              <div id="reserva-resumen-datos"></div>
            </div>

            <div class="reserva__nav-botones">
              <button class="btn-primario" id="btn-paso4-atras" style="background:transparent; color:var(--color-text-dark); border:1.5px solid rgba(17,17,17,0.2);">Atrás</button>
              <button class="btn-primario" id="btn-confirmar-reserva">Confirmar reserva</button>
            </div>
          </div>

          <!-- PANTALLA FINAL -->
          <div class="reserva__panel" id="panel-confirmacion"></div>

        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer__inner">
      <p class="footer__brand">Barber<span>App</span></p>
      <div class="footer__divider" aria-hidden="true"></div>
      <p class="footer__copy">© 2026 BarberApp — Todos los derechos reservados</p>
    </div>
  </footer>

  <script src="../js/mock-data.js"></script>
  <script src="../js/turnos-utils.js"></script>
  <script src="../js/reserva.js"></script>
</body>
</html>
